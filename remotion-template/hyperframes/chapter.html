<!doctype html>
<html lang="vi" data-composition-variables='[
  {"id":"kicker","type":"string","label":"Dòng nhỏ","default":"PHẦN THI THỨ HAI"},
  {"id":"title","type":"string","label":"Tiêu đề","default":"GIỚI THIỆU SÁCH"},
  {"id":"sub","type":"string","label":"Dòng phụ","default":"Người thắp đèn cho núi"},
  {"id":"tone","type":"string","label":"Tông màu (night|dawn|ember)","default":"night"}
]'>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="common.css" />
  <script src="node_modules/gsap/dist/gsap.min.js"></script>
  <script src="common.js"></script>
  <style>
    #bg.night { background: radial-gradient(ellipse at 50% 45%, #1c2140 0%, #070912 62%, #020205 100%); }
    #bg.dawn { background: radial-gradient(ellipse at 50% 70%, #6b3a52 0%, #251633 55%, #07040c 100%); }
    #bg.ember { background: radial-gradient(ellipse at 50% 55%, #4a1d0c 0%, #170804 60%, #050201 100%); }
    .bar { position: absolute; left: 0; width: 1920px; height: 2px; background: linear-gradient(90deg, rgba(255,214,140,0), #ffd68c, rgba(255,214,140,0)); }
    #b1 { top: 330px; } #b2 { top: 750px; }
    #kicker { font-weight: 700; font-size: 34px; letter-spacing: 18px; color: #f2b544; margin-bottom: 26px; }
    .mask { overflow: hidden; padding: 10px 20px 34px; }
    #title { font-family: PFD, serif; font-weight: 800; font-size: 132px; line-height: 1.08; color: #fff; }
    #sub { font-family: PFD, serif; font-style: italic; font-weight: 500; font-size: 52px; color: #ffd27a; margin-top: 18px; }
    #diamond { width: 22px; height: 22px; background: #f2b544; transform: rotate(45deg); margin: 34px auto 0; box-shadow: 0 0 24px rgba(242,181,68,.8); }
    #sweep { position: absolute; top: 0; left: -700px; width: 900px; height: 1080px;
      background: linear-gradient(100deg, rgba(255,240,210,0), rgba(255,240,210,.09), rgba(255,240,210,0)); mix-blend-mode: screen; }
  </style>
</head>
<body>
<div class="stage" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="__DUR__">
  <div class="layer clip" id="bg" data-start="0" data-duration="__DUR__"><div class="layer" id="dust"></div></div>
  <div class="layer clip" data-start="0" data-duration="__DUR__"><div class="bar" id="b1"></div><div class="bar" id="b2"></div></div>
  <div class="layer center clip" id="card" data-start="0" data-duration="__DUR__">
    <div id="kicker"></div>
    <div class="mask"><div id="title"></div></div>
    <div id="sub"></div>
    <div id="diamond"></div>
  </div>
  <div class="layer clip" data-start="0" data-duration="__DUR__"><div id="sweep"></div></div>
  <div class="layer vignette clip" data-start="0" data-duration="__DUR__"></div>
  <div class="layer clip" data-start="0" data-duration="__DUR__" style="overflow:hidden"><div class="grain" id="grain"></div></div>
  <script>
    (function () {
      const D = __DUR__;
      const v = HF.vars();
      document.getElementById("bg").classList.add(v.tone || "night");
      document.getElementById("kicker").textContent = v.kicker;
      document.getElementById("title").textContent = v.title;
      document.getElementById("sub").textContent = v.sub;
      if (!v.sub) document.getElementById("sub").style.display = "none";
      const dots = HF.dust(document.getElementById("dust"), 60, 11, { min: 2, max: 4 });
      const k = HF.chars(document.getElementById("kicker"));

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 0);
      dots.forEach((d) => tl.fromTo(d, { x: 0, y: 0 }, { x: +d.dataset.dx * 0.6, y: +d.dataset.dy * 0.6, duration: D, ease: "none" }, 0));
      tl.fromTo("#grain", { x: 0, y: 0 }, { x: -100, y: 70, duration: D, ease: "steps(" + Math.round(D * 12) + ")" }, 0);
      tl.fromTo(["#b1", "#b2"], { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "expo.out", stagger: 0.12 }, 0.3);
      tl.fromTo("#b1", { y: 80 }, { y: 0, duration: 1.4, ease: "power3.out" }, 0.3);
      tl.fromTo("#b2", { y: -80 }, { y: 0, duration: 1.4, ease: "power3.out" }, 0.3);
      tl.from(k, { opacity: 0, y: 16, duration: 0.45, stagger: 0.035, ease: "power2.out" }, 0.7);
      tl.fromTo("#title", { yPercent: 160 }, { yPercent: 0, duration: 1.1, ease: "expo.out" }, 1.1);
      tl.fromTo("#sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 1.8);
      tl.fromTo("#diamond", { scale: 0, rotation: -135 }, { scale: 1, rotation: 45, duration: 0.9, ease: "back.out(2)" }, 2.1);
      tl.fromTo("#sweep", { x: 0 }, { x: 3200, duration: 1.6, ease: "power2.inOut" }, 2.3);
      tl.fromTo("#card", { scale: 1 }, { scale: 1.04, duration: D, ease: "none" }, 0);
      tl.to("#card", { opacity: 0, y: -30, duration: 0.8, ease: "power2.in" }, D - 1.0);
      tl.to("#bg", { opacity: 0, duration: 0.6, ease: "power2.in" }, D - 0.6);
      window.__timelines = window.__timelines || {};
      window.__timelines["root"] = tl;
    })();
  </script>
</div>
</body>
</html>
