<!doctype html>
<html lang="vi" data-composition-variables='[
  {"id":"title","type":"string","label":"Tiêu đề","default":"NGƯỜI THẮP ĐÈN CHO NÚI"},
  {"id":"blocks","type":"string","label":"Danh đề (JSON: [{role, names:[...]}])","default":"[]"},
  {"id":"thanks","type":"string","label":"Lời cuối","default":"Xin trân trọng cảm ơn!"}
]'>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="common.css" />
  <script src="node_modules/gsap/dist/gsap.min.js"></script>
  <script src="common.js"></script>
  <style>
    #bg { background: radial-gradient(ellipse at 50% 100%, #3a2412 0%, #0d0a14 55%, #020205 100%); }
    #lampglow { position: absolute; left: 50%; bottom: -260px; width: 1300px; height: 800px; margin-left: -650px;
      background: radial-gradient(ellipse, rgba(255,196,110,.45), rgba(255,196,110,0) 65%); }
    #roll { position: absolute; left: 0; right: 0; top: 0; text-align: center; }
    .t0 { font-family: PFD, serif; font-weight: 800; font-size: 84px; color: #ffd27a; height: 120px; line-height: 120px; }
    .role { font-weight: 700; font-size: 26px; letter-spacing: 8px; color: #f2b544; height: 50px; line-height: 50px; margin-top: 46px; }
    .name { font-family: PFD, serif; font-weight: 800; font-size: 46px; height: 66px; line-height: 66px; color: #fff; }
    #thanks { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: PFD, serif; font-style: italic; font-weight: 500; font-size: 80px; color: #ffe6b0; text-shadow: 0 0 40px rgba(255,190,90,.5); }
    .fadeedge { position: absolute; left: 0; right: 0; height: 260px; pointer-events: none; }
    #ft { top: 0; background: linear-gradient(#020205, rgba(2,2,5,0)); }
    #fb { bottom: 0; background: linear-gradient(rgba(2,2,5,0), #020205); }
  </style>
</head>
<body>
<div class="stage" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="__DUR__">
  <div class="layer clip" id="bg" data-start="0" data-duration="__DUR__"><div id="lampglow"></div><div class="layer" id="dust"></div></div>
  <div class="layer clip" data-start="0" data-duration="__DUR__" style="overflow:hidden"><div id="roll"></div></div>
  <div class="layer clip" data-start="0" data-duration="__DUR__"><div class="fadeedge" id="ft"></div><div class="fadeedge" id="fb"></div></div>
  <div class="layer clip" data-start="0" data-duration="__DUR__"><div id="thanks"></div></div>
  <div class="layer vignette clip" data-start="0" data-duration="__DUR__"></div>
  <div class="layer clip" data-start="0" data-duration="__DUR__" style="overflow:hidden"><div class="grain" id="grain"></div></div>
  <script>
    (function () {
      const D = __DUR__;
      const v = HF.vars();
      let blocks = [];
      try { blocks = typeof v.blocks === "string" ? JSON.parse(v.blocks) : v.blocks || []; } catch (e) { blocks = []; }
      const roll = document.getElementById("roll");
      const add = (cls, text) => { const d = document.createElement("div"); d.className = cls; d.textContent = text; roll.appendChild(d); };
      add("t0", v.title);
      let h = 120;
      blocks.forEach((b) => { add("role", b.role); h += 96; (b.names || []).forEach((n) => { add("name", n); h += 66; }); });
      document.getElementById("thanks").textContent = v.thanks;
      const dots = HF.dust(document.getElementById("dust"), 50, 23, { min: 2, max: 4 });

      const tl = gsap.timeline({ paused: true });
      const rollEnd = D - 4.5;
      tl.fromTo("#bg", { opacity: 0 }, { opacity: 1, duration: 1 }, 0);
      dots.forEach((d) => tl.fromTo(d, { x: 0, y: 0 }, { x: +d.dataset.dx, y: +d.dataset.dy, duration: D, ease: "none" }, 0));
      tl.fromTo("#grain", { x: 0, y: 0 }, { x: -100, y: 70, duration: D, ease: "steps(" + Math.round(D * 12) + ")" }, 0);
      tl.fromTo("#lampglow", { scale: 0.9, opacity: 0.7 }, { scale: 1.1, opacity: 1, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo("#roll", { y: 1080 }, { y: -h, duration: rollEnd, ease: "none" }, 0.3);
      tl.fromTo("#thanks", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, rollEnd - 0.4);
      tl.to(["#thanks", "#bg"], { opacity: 0, duration: 1.2, ease: "power2.in" }, D - 1.3);
      window.__timelines = window.__timelines || {};
      window.__timelines["root"] = tl;
    })();
  </script>
</div>
</body>
</html>
